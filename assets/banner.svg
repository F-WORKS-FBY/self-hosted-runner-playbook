<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="t d">
  <title id="t">self-hosted-runner-playbook</title>
  <desc id="d">A self-hosted GitHub Actions runner console. The setup pipeline reads preflight GO, bootstrap 8 of 8, verify 34 PASS 0 FAIL, workflow rewrite done by hand, CI_RUNNER switched on, test PRs. The runner connects to GitHub, listens for jobs and runs lint, typecheck, build and verify, each wrapped by the ci-cleanup.sh hook. A status bar shows the runner active, the hourly ci-health check and alerts sent to Feishu.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .fg { fill: #E6EDF3; }
    .dim { fill: #8B949E; }
    .faint { fill: #6E7681; }
    .ok { fill: #3FB950; }
    .info { fill: #58A6FF; }
    .warn { fill: #D29922; }
    .ev { animation: rise .45s ease-out both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .7s cubic-bezier(.3,.7,.3,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
    .d4 { animation-delay: .75s; } .d5 { animation-delay: .95s; } .d6 { animation-delay: 1.15s; }
    .d7 { animation-delay: 1.5s; } .d8 { animation-delay: 1.8s; } .d9 { animation-delay: 2.1s; }
    .d10 { animation-delay: 2.5s; } .d11 { animation-delay: 2.9s; } .d12 { animation-delay: 3.3s; }
    .d13 { animation-delay: 3.7s; } .d14 { animation-delay: 4.1s; }
    .flow { animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    @keyframes pulse { 50% { opacity: .25; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ev, .grow, .flow, .pulse, .cursor { animation: none; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="958" height="510" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <path d="M1 41 V15 A14 14 0 0 1 15 1 H945 A14 14 0 0 1 959 15 V41 Z" fill="#161B22"/>
  <line x1="1" y1="41" x2="959" y2="41" stroke="#30363D"/>
  <circle cx="26" cy="21" r="6" fill="#FF5F57"/>
  <circle cx="46" cy="21" r="6" fill="#FEBC2E"/>
  <circle cx="66" cy="21" r="6" fill="#28C840"/>
  <text x="480" y="26" text-anchor="middle" class="mono dim" font-size="13">runner@ci <tspan dx="8">/opt/actions-runner</tspan></text>

  <!-- header -->
  <rect x="32" y="60" width="896" height="72" rx="9" fill="#0D1117" stroke="#2EA043" stroke-width="1.5"/>
  <circle cx="62" cy="96" r="14" fill="none" stroke="#3FB950" stroke-width="2.4"/>
  <path d="M57.5 88.5 L68.5 96 L57.5 103.5 Z" fill="#3FB950"/>
  <text x="90" y="92" class="mono fg" font-size="19" font-weight="700">self-hosted-runner-playbook</text>
  <text x="90" y="116" class="mono dim" font-size="14">Bare Ubuntu host to GitHub Actions runner: size, install, harden, verify, operate.</text>

  <!-- setup pipeline -->
  <line x1="40" y1="174" x2="920" y2="174" stroke="#30363D" stroke-width="2"/>
  <line class="flow" x1="40" y1="174" x2="920" y2="174" stroke="#3FB950" stroke-width="2" stroke-dasharray="4 12" opacity=".8"/>
  <g class="mono" font-size="12.5">
    <g class="ev d1">
      <rect x="32" y="150" width="140" height="48" rx="7" fill="#161B22" stroke="#2EA043"/>
      <text x="44" y="169" class="fg"><tspan class="faint">1 </tspan>preflight.sh</text>
      <text x="44" y="188" class="ok" font-weight="700">GO</text>
    </g>
    <g class="ev d2">
      <rect x="183" y="150" width="140" height="48" rx="7" fill="#161B22" stroke="#2EA043"/>
      <text x="195" y="169" class="fg"><tspan class="faint">2 </tspan>bootstrap.sh</text>
      <text x="195" y="188" class="ok" font-weight="700">8/8 steps</text>
    </g>
    <g class="ev d3">
      <rect x="334" y="150" width="140" height="48" rx="7" fill="#161B22" stroke="#2EA043"/>
      <text x="346" y="169" class="fg"><tspan class="faint">3 </tspan>verify.sh</text>
      <text x="346" y="188" class="ok" font-weight="700">34 PASS 0 FAIL</text>
    </g>
    <g class="ev d4">
      <rect x="485" y="150" width="140" height="48" rx="7" fill="#161B22" stroke="#BB8009"/>
      <text x="497" y="169" class="fg"><tspan class="faint">4 </tspan>workflows</text>
      <text x="497" y="188" class="warn" font-weight="700">by hand, ch.05</text>
    </g>
    <g class="ev d5">
      <rect x="636" y="150" width="140" height="48" rx="7" fill="#161B22" stroke="#1F6FEB"/>
      <text x="648" y="169" class="fg"><tspan class="faint">5 </tspan>CI_RUNNER</text>
      <text x="648" y="188" class="info" font-weight="700">switch on</text>
    </g>
    <g class="ev d6">
      <rect x="787" y="150" width="141" height="48" rx="7" fill="#161B22" stroke="#1F6FEB"/>
      <text x="799" y="169" class="fg"><tspan class="faint">6 </tspan>test PRs</text>
      <text x="799" y="188" class="info" font-weight="700">2 PRs + nightly</text>
    </g>
  </g>

  <!-- runner console -->
  <rect x="32" y="218" width="612" height="226" rx="8" fill="#010409" stroke="#30363D"/>
  <text x="48" y="238" class="mono faint" font-size="11.5" letter-spacing="1">RUNNER.LISTENER</text>
  <g class="mono" font-size="14">
    <g class="ev d7">
      <path d="M48 256 l4 4 l8 -9" fill="none" stroke="#3FB950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="262" class="fg">Connected to GitHub</text>
    </g>
    <text x="48" y="285" class="dim ev d8">Current runner version: '2.337.0'</text>
    <g class="ev d9">
      <circle class="pulse" cx="53" cy="303" r="4.5" fill="#58A6FF"/>
      <text x="68" y="308" class="info">Listening for Jobs</text>
    </g>

    <!-- jobs: bar length ~ duration (reference project, ch.07) -->
    <g class="ev d10">
      <text x="48" y="340" class="fg">lint</text>
      <rect x="158" y="330" width="310" height="12" rx="3" fill="#161B22"/>
      <rect class="grow d10" x="158" y="330" width="85" height="12" rx="3" fill="#238636"/>
      <path d="M158 330 l6 6 l-6 6 l-6 -6 Z M243 330 l6 6 l-6 6 l-6 -6 Z" fill="#58A6FF"/>
      <text x="486" y="340"><tspan class="ok">Succeeded</tspan><tspan class="dim" x="590">52s</tspan></text>
    </g>
    <g class="ev d11">
      <text x="48" y="366" class="fg">typecheck</text>
      <rect x="158" y="356" width="310" height="12" rx="3" fill="#161B22"/>
      <rect class="grow d11" x="158" y="356" width="120" height="12" rx="3" fill="#238636"/>
      <path d="M158 356 l6 6 l-6 6 l-6 -6 Z M278 356 l6 6 l-6 6 l-6 -6 Z" fill="#58A6FF"/>
      <text x="486" y="366"><tspan class="ok">Succeeded</tspan><tspan class="dim" x="590">73s</tspan></text>
    </g>
    <g class="ev d12">
      <text x="48" y="392" class="fg">build</text>
      <rect x="158" y="382" width="310" height="12" rx="3" fill="#161B22"/>
      <rect class="grow d12" x="158" y="382" width="51" height="12" rx="3" fill="#238636"/>
      <path d="M158 382 l6 6 l-6 6 l-6 -6 Z M209 382 l6 6 l-6 6 l-6 -6 Z" fill="#58A6FF"/>
      <text x="486" y="392"><tspan class="ok">Succeeded</tspan><tspan class="dim" x="590">31s</tspan></text>
    </g>
    <g class="ev d13">
      <text x="48" y="418" class="fg">verify</text>
      <rect class="grow d13" x="158" y="408" width="310" height="12" rx="3" fill="#238636"/>
      <path d="M158 408 l6 6 l-6 6 l-6 -6 Z M468 408 l6 6 l-6 6 l-6 -6 Z" fill="#58A6FF"/>
      <text x="486" y="418"><tspan class="ok">Succeeded</tspan><tspan class="dim" x="582">189s</tspan></text>
    </g>
    <rect class="cursor" x="48" y="428" width="8" height="10" fill="#E6EDF3"/>
  </g>

  <!-- host card -->
  <g class="mono ev d14">
    <rect x="660" y="218" width="268" height="226" rx="8" fill="#0D1117" stroke="#30363D"/>
    <text x="676" y="238" class="faint" font-size="11.5" letter-spacing="1">HOST</text>
    <g font-size="12.5">
      <text x="676" y="262" class="fg">4 vCPU · 7.5 GiB · N=1</text>
      <text x="676" y="282" class="fg">Docker 29 + containerd</text>
      <text x="676" y="302" class="fg">runner 2.337.0</text>
      <text x="676" y="322" class="dim">self-hosted,linux,x64,ci</text>
      <line x1="676" y1="338" x2="912" y2="338" stroke="#30363D"/>
      <path d="M682 350 l6 6 l-6 6 l-6 -6 Z" fill="#58A6FF"/>
      <text x="696" y="361" class="info">ci-cleanup.sh</text>
      <text x="676" y="384" class="fg">JOB_STARTED<tspan x="790" class="dim">before job</tspan></text>
      <text x="676" y="404" class="fg">JOB_COMPLETED<tspan x="790" class="dim">after job</tspan></text>
      <text x="676" y="424" class="fg">daily timer<tspan x="790" class="dim">04:17</tspan></text>
    </g>
  </g>

  <!-- status bar -->
  <g class="mono" font-size="12">
    <rect x="32" y="460" width="896" height="30" rx="6" fill="#161B22" stroke="#30363D"/>
    <path d="M38 460 H162 L174 475 L162 490 H38 A6 6 0 0 1 32 484 V466 A6 6 0 0 1 38 460 Z" fill="#238636"/>
    <circle class="pulse" cx="50" cy="475" r="4" fill="#E6EDF3"/>
    <text x="62" y="479" fill="#FFFFFF" font-weight="700">runner active</text>
    <text x="188" y="479" class="fg">ci-health <tspan class="dim">hourly @ :13</tspan></text>
    <line x1="360" y1="467" x2="360" y2="483" stroke="#30363D"/>
    <text x="374" y="479" class="dim">fail streak <tspan class="fg">≥ 3</tspan> → <tspan class="warn">CRIT</tspan></text>
    <line x1="547" y1="467" x2="547" y2="483" stroke="#30363D"/>
    <text x="561" y="479" class="dim">alerts → <tspan class="info">Feishu</tspan></text>
    <line x1="684" y1="467" x2="684" y2="483" stroke="#30363D"/>
    <text x="912" y="479" text-anchor="end" class="dim">Restart=always · live-restore</text>
  </g>
</svg>
